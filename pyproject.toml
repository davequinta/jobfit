[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfit"
version = "0.1.0"
description = "Ingest, filter, and score remote job postings against your own profile. Applies to nothing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "selectolax>=0.3",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "pydantic>=2.0",
]

[project.scripts]
jobfit = "jobfit.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobfit = ["schema.sql", "templates/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "evals"]
